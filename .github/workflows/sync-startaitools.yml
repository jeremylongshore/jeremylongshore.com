name: Sync Start AI Tools
on:
  # schedule disabled — burns Actions minutes
  # schedule:
  #   - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — includes 2026-07-20 backport of allow-unsafe-pr-checkout
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - name: Run sync
        run: python scripts/sync-startaitools.py
      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(sync): import Start AI Tools posts"
            git push
          else
            echo "No changes."
          fi