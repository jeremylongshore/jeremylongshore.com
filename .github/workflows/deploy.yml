name: Deploy jeremylongshore.com to VPS

# Push to main -> CI build gate (Next.js typecheck + production build) ->
# Tailscale OIDC -> SSH to the intentsolutions VPS -> force-command
# /usr/local/sbin/deploy-jeremylongshore (git fetch + docker compose build +
# up -d; image is built ON the VPS) -> Caddy reverse_proxy -> /api/healthz
# smoke check.
#
# Docker variant of the reusable vps-deploy workflow (D90). Replaced the
# static Ruby/Linkyee pipeline at the Next.js hub cutover — see
# 000-docs/004-OD-RUNB-vps-cutover-runbook.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for Tailscale OIDC

concurrency:
  group: deploy-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: pre-deploy build gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — includes 2026-07-20 backport of allow-unsafe-pr-checkout
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build (validates ISR fetch boundaries render)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # stars/heatmap/contributions fetchers
        run: pnpm build
      - name: Name-leak gate
        run: bash scripts/name-leak-gate.sh

  deploy:
    needs: test
    uses: jeremylongshore/.github/.github/workflows/vps-deploy.yml@53d6be37d6c046818157b954acb33667ac095dd8
    with:
      variant: docker
      srv-path: /srv/jeremylongshore
      health-check-url: https://jeremylongshore.com/api/healthz
      vps-tailnet-ip: 100.88.144.55
      vps-public-ip: 167.86.106.29
      vps-host: intentsolutions
      vps-user: intentsolutions
      smoke-validation: '.ok == true'
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
