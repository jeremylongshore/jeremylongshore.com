<style>
/* ---------------------------------------------------------------------------
   Blueprint skin. Every value here resolves to a token in
   references/style-guide.md — scripts/lint_skin.py reads that file and rejects
   anything not in it. Do not inline a colour that is not in those tables.

   This template is verified, not asserted:
     python3 <skill-dir>/scripts/self_check.py     <this file>
     python3 <skill-dir>/scripts/lint_skin.py      <this file>
     python3 <skill-dir>/scripts/verify_geometry.py <this file>
   All three pass on the file as shipped. Its predecessor failed four of its own
   validator's five checks, which is why that is stated as a testable claim.
--------------------------------------------------------------------------- */
:root{
  --paper:#f3f6f4; --paper-2:#eef2ef; --canvas:#ffffff;
  --ink:#161b1d; --muted:#4f5b60; --soft:#636e72;
  --rule:#d3dbd7; --rule-solid:#b9c3be;
  --accent:#ef5a24; --accent-dark:#c94213; --accent-tint:rgba(239,90,36,0.08);
  --link:#2e5c59;
}
*{box-sizing:border-box;min-width:0}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif; font-size:16px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%; max-width:76rem; margin:0 auto; padding:3rem clamp(1.25rem,4vw,3rem)}

/* Eyebrow follows the Intent Solutions .isl-kicker signature: mono, uppercase,
   0.12em tracking, blueprint teal, preceded by a 2rem signal-orange rule. */
.kicker{
  display:inline-flex; align-items:center; gap:.75rem; margin:0 0 1.1rem;
  color:var(--link); font-family:'Geist Mono',ui-monospace,monospace;
  font-size:.69rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
}
.kicker::before{content:""; width:2rem; height:1px; background:var(--accent)}
h1{margin:0 0 .35rem; font-family:'Syne',system-ui,sans-serif; font-size:1.75rem; font-weight:700; letter-spacing:-.01em}
.sub{margin:0 0 2rem; color:var(--muted); font-size:.95rem; max-width:60ch}

/* Container is clean by default — the figure sits on page paper, no chrome. */
figure{margin:0; overflow-x:auto}
svg{display:block; width:100%; height:auto; max-width:880px}

.status{
  display:inline-flex; align-items:center; gap:.5rem; margin-top:2rem;
  color:var(--soft); font-family:'Geist Mono',ui-monospace,monospace;
  font-size:.69rem; letter-spacing:.12em; text-transform:uppercase;
}
.status::before{
  content:""; width:6px; height:6px; border-radius:50%; background:var(--accent);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* The predecessor shipped `pulse 2s infinite` with no guard and still passed its
   own gate, because that gate only looked for this rule when it found a script.
   self_check.py now keys off the declared property instead. */
@media (prefers-reduced-motion: reduce){
  .status::before{animation:none}
  *{transition:none !important}
}
@media print{
  body{background:#ffffff}
  .status::before{animation:none}
}
:focus-visible{outline:3px solid var(--accent); outline-offset:4px; border-radius:2px}

@media (prefers-color-scheme: dark){
  /* Graphite skin — same roles, alternate values. See style-guide.md. */
  :root{
    --paper:#111417; --paper-2:#191d21; --canvas:#1f2429;
    --ink:#f3f6f4; --muted:#a1a1aa; --soft:#83838d;
    --rule:rgba(243,246,244,0.12); --rule-solid:rgba(161,161,170,0.25);
    --accent:#fb923c; --accent-dark:#f97316; --accent-tint:rgba(251,146,60,0.10);
    --link:#5e9c98;
  }
}
</style>
